<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CloudDeploy — Devansh Tiwari</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 80px auto;
      padding: 0 20px;
      color: #1a1a1a;
      line-height: 1.6;
    }
    h1 { color: #2563eb; }
    code {
      background: #f4f4f5;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .tag {
      display: inline-block;
      background: #eef2ff;
      color: #4338ca;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 14px;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <h1>CloudDeploy v2</h1>
  <p>Automated deployment to AWS S3, triggered by every push to <code>main</code>.</p>
  <p>
    <span class="tag">AWS S3</span>
    <span class="tag">GitHub Actions</span>
    <span class="tag">IAM</span>
  </p>
  <p>Deployed by Devansh Tiwari — <span id="date"></span></p>
  <script>
    document.getElementById('date').textContent = new Date().toLocaleString();
  </script>
</body>
</html>
